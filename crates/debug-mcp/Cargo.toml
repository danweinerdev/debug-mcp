[package]
name = "debug-mcp"
description = "The debug-mcp binary: registers the backend factory, wires session/tools, rmcp serve(stdio)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "debug-mcp"
path = "src/main.rs"

[dependencies]
debugger-core.workspace = true
mcp-session.workspace = true
mcp-tools.workspace = true
rmcp.workspace = true
tokio = { workspace = true }

# lldb is a macOS/Linux backend — the binary only links/registers it (and its DAP transport)
# off Windows. lldb-on-Windows can be added later by also registering it under cfg(windows).
[target.'cfg(not(windows))'.dependencies]
lldb-backend.workspace = true
dap-client.workspace = true

# The WinDbg backend is Windows-only (registered by the binary under cfg(windows)).
[target.'cfg(windows)'.dependencies]
windbg-backend.workspace = true
