[package]
name = "integration-tests"
description = "Phase 6 test-support library: the in-process harness (a real ToolServer over a real SessionManager + the real LldbFactory) and a stdio MCP client, consumed by the live integration + differential-parity suites in mcp-tools/tests/. A dedicated crate so it can depend on lldb-backend without mcp-tools' own (normal) dependency graph ever naming it — the seam stays clean."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Library-only: the shared test-support helpers (the in-process harness + the stdio MCP
# client), consumed as `pub` API by the suites in mcp-tools/tests/.
[lib]
path = "src/lib.rs"

[dependencies]
mcp-session.workspace = true
mcp-tools.workspace = true
tokio = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }

# lldb is the macOS/Linux backend — the in-process harness links/registers it only off
# Windows (its cfg(unix) `Harness::new` template). This keeps lldb-backend (and its DAP
# transport) out of the Windows build entirely.
[target.'cfg(not(windows))'.dependencies]
lldb-backend.workspace = true

# windbg is the Windows backend — the harness' cfg(windows) `Harness::new_windbg`
# constructor builds a server over it. Because `integration-tests` is only a DEV-dependency
# of `mcp-tools`, `windbg-backend` (and `dbgeng-sys`) never reach mcp-tools' normal
# dependency edge — the seam stays intact.
[target.'cfg(windows)'.dependencies]
windbg-backend.workspace = true
